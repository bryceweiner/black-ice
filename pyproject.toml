[project]
name = "blackice"
version = "0.1.0"
description = "Local-first home monitoring AI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "anyascii>=0.3.3",
]

[project.optional-dependencies]
guard = ["transformers>=4.48", "torch>=2.6"]
memory = ["sentence-transformers>=3.4"]
# voice2 and kokoro-memory are not on PyPI — install from their HF repos:
#   uv pip install "git+https://huggingface.co/AIIT-Threshold/voice2"
#   uv pip install "git+https://huggingface.co/AIIT-Threshold/kokoro-memory"
voice = ["faster-whisper>=1.1", "torch>=2.6", "sounddevice>=0.5"]

[project.scripts]
blackice = "blackice.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackice"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
