[project]
name = "blackice-plugin-crypto"
version = "0.1.0"
description = "Cryptocurrency address balance monitoring for Black Ice"
requires-python = ">=3.13,<3.14"
# Every balance and price comes over HTTP. httpx is already a core dependency;
# naming it here keeps the plugin installable on its own.
dependencies = ["httpx>=0.28"]

[project.entry-points."blackice.plugins"]
crypto = "blackice_crypto:CryptoPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackice_crypto"]
