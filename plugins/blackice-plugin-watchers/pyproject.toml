[project]
name = "blackice-plugin-watchers"
version = "0.1.0"
description = "Black Ice plugin: recognise people on the V380 cameras"
requires-python = ">=3.13,<3.14"
# The base install is deliberately light: numpy for embeddings, av for decoding
# Annex B and writing JPEG crops. Both are already present in this environment.
# The recognition stack is an extra because ultralytics/insightface/boxmot pin
# their own torch, and a failed build of one of them must not stop Black Ice
# from booting. Without it the plugin still starts, still serves its widgets
# from the database, and says on the dashboard that it cannot recognise anyone.
dependencies = ["numpy>=2.0", "av>=14.0"]

[project.optional-dependencies]
models = [
    "ultralytics>=8.3",
    "insightface>=0.7.3",
    "onnxruntime>=1.20",
    "boxmot>=13.0",
    "torch>=2.6",
]

[project.scripts]
blackice-watchers-provision = "blackice_watchers.provision:main"

[project.entry-points."blackice.plugins"]
watchers = "blackice_watchers:WatchersPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackice_watchers"]
