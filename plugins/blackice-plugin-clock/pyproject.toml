[project]
name = "blackice-plugin-clock"
version = "0.1.0"
description = "Black Ice plugin: current time and date"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.entry-points."blackice.plugins"]
clock = "blackice_clock:ClockPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackice_clock"]
