[project]
name = "blackice-plugin-v380"
version = "0.1.0"
description = "V380 LAN cameras for Black Ice: discovery, decrypted video, control"
requires-python = ">=3.13,<3.14"
# AES-128-ECB for the login password and the media stream. Pure-Python AES is
# far too slow for per-frame decryption; this is OpenSSL underneath.
dependencies = ["cryptography>=44.0"]

[project.entry-points."blackice.plugins"]
v380 = "blackice_v380:V380Plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackice_v380"]
