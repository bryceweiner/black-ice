[project]
name = "blackice-plugin-heartbeat"
version = "0.1.0"
description = "Reference Black Ice plugin: periodic heartbeat sensor"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.entry-points."blackice.plugins"]
heartbeat = "blackice_heartbeat:HeartbeatPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackice_heartbeat"]
